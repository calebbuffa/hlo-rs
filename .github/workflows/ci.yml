name: Rust checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Rust
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default 1.95.0
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --all-features --locked
      - run: cargo clippy --workspace --locked --all-targets --all-features -- -D warnings
      - run: cargo package --locked -p stablehlo
      - name: Verify XLA HLO package
        run: |
          $env:XLA_SOURCE_DIR = (Resolve-Path extern/xla).Path
          cargo package --locked -p xlahlo

  source-audits:
    name: Source audits (not executable oracles)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: openxla/stablehlo
          ref: 25605c9f48a9aec305876d60d26b028398d298d2
          path: extern/stablehlo
      - name: Install Rust
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default 1.95.0
      - name: Audit XLA opcode catalog against checked-out source
        run: |
          $env:XLA_REFERENCE_DIR = (Resolve-Path extern/xla).Path
          cargo test --locked -p xlahlo --test reference -- --ignored
      - name: Audit pinned StableHLO fixtures
        run: |
          $env:STABLEHLO_REFERENCE_DIR = (Resolve-Path extern/stablehlo).Path
          cargo test --locked -p stablehlo --test reference_fixtures -- --ignored
