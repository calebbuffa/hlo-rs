[package]
name = "clienthlo"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license.workspace = true
description = "Client HLO (CHLO) dialect for pliron: ergonomic client ops that augment StableHLO"
repository = "https://github.com/calebbuffa/hlo-rs"
documentation = "https://docs.rs/clienthlo"
readme = "README.md"
include = ["src/**", "README.md", "LICENSE"]
keywords = ["chlo", "stablehlo", "tensor", "ir"]
categories = ["compilers", "data-structures"]

[dependencies]
pliron = { version = "0.19", default-features = false }
stablehlo = { version = "0.2.0", path = "../stablehlo" }
thiserror = "2"

[lints.rust]
unsafe_code = "forbid"
