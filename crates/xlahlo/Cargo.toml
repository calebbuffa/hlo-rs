[package]
name = "xlahlo"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
description = "OpenXLA HLO dialect for pliron"
keywords = ["xla", "hlo", "compiler", "ir", "pliron"]
categories = ["compilers", "data-structures"]
repository = "https://github.com/calebbuffa/hlo-rs"
documentation = "https://docs.rs/xlahlo"
readme = "README.md"
include = ["src/**", "README.md", "LICENSE"]

[dependencies]
pliron = { version = "0.20", default-features = false }
thiserror = "2"

[lints.rust]
unsafe_code = "forbid"
