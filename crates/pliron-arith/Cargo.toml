[package]
name = "pliron-arith"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0 AND Apache-2.0 WITH LLVM-exception"
description = "MLIR arith dialect for pliron"
repository = "https://github.com/calebbuffa/pliron-dialects"
documentation = "https://docs.rs/pliron-arith"
readme = "README.md"
include = ["src/**", "README.md", "LICENSE*", "NOTICE"]
keywords = ["mlir", "arith", "compiler", "pliron", "ir"]
categories = ["compilers", "data-structures"]

[dependencies]
pliron = { version = "0.20", default-features = false }
pliron-mlir-builtin = { version = "0.1.0", path = "../pliron-mlir-builtin" }
thiserror = "2"
pliron-mlir-interop = { version = "0.1.0", optional = true }

[features]
default = []
mlir-interop = ["dep:pliron-mlir-interop", "pliron-mlir-builtin/mlir-interop"]

[package.metadata.docs.rs]
features = ["mlir-interop"]

[lints.rust]
unsafe_code = "forbid"
