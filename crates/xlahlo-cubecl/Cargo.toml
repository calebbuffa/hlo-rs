[package]
name = "xlahlo-cubecl"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license.workspace = true
description = "CubeCL IR lowering for optimized xlahlo programs"
keywords = ["xla", "hlo", "cubecl", "compiler"]
categories = ["compilers"]
repository = "https://github.com/calebbuffa/hlo-rs"
documentation = "https://docs.rs/xlahlo-cubecl"
readme = "README.md"
include = ["src/**", "README.md"]

[dependencies]
pliron = { version = "0.19", default-features = false }
thiserror = "2"
xlahlo = { version = "0.1.0", path = "../xlahlo" }
cubecl-ir = { version = "=0.11.0", default-features = false }
cubecl-core = { version = "=0.11.0", default-features = false, features = ["std"] }
cubecl-runtime = { version = "=0.11.0", default-features = false, features = ["std"] }
rustc_apfloat = "0.2"
