[package]
name = "stablehlo"
version = "0.4.0"
edition = "2024"
rust-version = "1.95"
license.workspace = true
description = "StableHLO dialect for pliron"
repository = "https://github.com/calebbuffa/pliron-dialects"
documentation = "https://docs.rs/stablehlo"
readme = "README.md"
include = ["src/**", "README.md", "LICENSE"]
keywords = ["stablehlo", "mlir", "tensor", "compiler", "pliron"]
categories = ["compilers", "data-structures"]

[package.metadata.docs.rs]
features = ["mlir-interop"]

[lib]
path = "src/lib.rs"

[dependencies]
pliron = { version = "0.20", default-features = false }
pliron-mlir-builtin = { version = "0.1.0", path = "../pliron-mlir-builtin" }
pliron-mlir-interop = { version = "0.1.0", optional = true }
rustc_apfloat = { version = "0.2.3", optional = true }
thiserror = "2"

[dev-dependencies]
serde_json = "1"

[features]
default = []
mlir-interop = ["dep:pliron-mlir-interop", "dep:rustc_apfloat", "pliron-mlir-builtin/mlir-interop"]

[lints.rust]
unsafe_code = "forbid"
