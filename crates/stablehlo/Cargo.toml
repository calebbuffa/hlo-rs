[package]
name = "stablehlo"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
license.workspace = true
description = "StableHLO dialect for pliron"
repository = "https://github.com/calebbuffa/hlo-rs"
documentation = "https://docs.rs/stablehlo"
readme = "README.md"
include = ["src/**", "README.md", "LICENSE"]
keywords = ["stablehlo", "mlir", "tensor", "compiler", "pliron"]
categories = ["compilers", "data-structures"]

[lib]
path = "src/lib.rs"

[dependencies]
pliron = { version = "0.19", default-features = false }
thiserror = "2"

[lints.rust]
unsafe_code = "forbid"
