[package]
name = "pliron-tensor"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0 AND Apache-2.0 WITH LLVM-exception"
description = "MLIR tensor dialect for pliron"
repository = "https://github.com/calebbuffa/pliron-dialects"
documentation = "https://docs.rs/pliron-tensor"
readme = "README.md"
include = ["src/**", "README.md", "LICENSE*", "NOTICE"]
keywords = ["mlir", "tensor", "compiler", "pliron"]
categories = ["compilers", "data-structures"]

[dependencies]
pliron = { version = "0.20", default-features = false }
pliron-arith = { version = "0.1.0", path = "../pliron-arith" }
pliron-mlir-builtin = { version = "0.1.0", path = "../pliron-mlir-builtin" }
thiserror = "2"
pliron-mlir-interop = { version = "0.1.0", optional = true }

[features]
default = []
mlir-interop = [
    "pliron-mlir-builtin/mlir-interop",
    "dep:pliron-mlir-interop",
    "pliron-arith/mlir-interop",
]

[package.metadata.docs.rs]
features = ["mlir-interop"]

[lints.rust]
unsafe_code = "forbid"
